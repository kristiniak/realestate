<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nehnuteľnosť – Real Estate</title>
<link rel="icon" href="img/onyx_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="web.css">
<style>
  .crumbs{padding:24px 0 0;color:var(--muted);font-size:14px}
  .crumbs a{color:var(--pin);text-decoration:none}
  .crumbs a:hover{text-decoration:underline}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:18px 0 22px}
  .head h1{font-size:clamp(40px,5.5vw,68px)}
  .street{color:var(--muted);opacity:.75;font-size:16px;letter-spacing:.06em;margin:8px 0 0}
  .head .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .head-price{text-align:right}
  .head-price b{display:block;font-family:var(--serif);font-size:clamp(34px,4vw,48px);color:var(--pin);font-weight:600;line-height:1}
  .head-price span{color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .is-sold .head-price b{color:var(--muted);text-decoration:line-through}

  /* Galéria */
  .gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:clamp(300px,52vw,560px)}
  .gallery.one{grid-template-columns:1fr;grid-template-rows:1fr}
  .gallery.two{grid-template-rows:1fr}
  .gallery button{position:relative;padding:0;border:0;cursor:zoom-in;background:#1e1d22 center/cover no-repeat;overflow:hidden}
  .gallery button:first-child{grid-row:1 / -1}
  .gallery.two button:first-child{grid-row:auto}
  .gallery button:hover{filter:brightness(1.08)}
  .gallery button:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
  .gallery .more{position:absolute;right:12px;bottom:12px;background:rgba(13,13,15,.85);color:var(--text);border:1px solid var(--pin);
    font:500 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:8px 12px}
  .gallery .m-only{display:none}
  .no-photo{height:280px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
  .is-sold .gallery button{filter:grayscale(.7) brightness(.8)}

  /* Obsah */
  .body{display:grid;grid-template-columns:1fr 360px;gap:48px;padding:40px 0 64px;align-items:start}
  .block{margin:0 0 40px}
  .block h2{font-size:34px;margin:0 0 16px;color:var(--pin)}
  /* Rozbaľovacie „Parametre“ */
  .fold > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--pin);padding-bottom:10px;margin-bottom:6px}
  .fold > summary::-webkit-details-marker{display:none}
  .fold > summary h2{margin:0}
  .fold > summary::after{content:'Skryť ▴';color:var(--pin);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
  .fold:not([open]) > summary::after{content:'Zobraziť ▾'}
  .fold > summary:focus-visible{outline:2px solid var(--pin);outline-offset:4px}
  .desc p{color:#d8d1c2;line-height:1.75;margin:0 0 14px;max-width:70ch}
  .params{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;margin:0}
  .params div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
  .params dt{color:var(--muted)} .params dd{margin:0;text-align:right}
  .media-btns{display:flex;flex-wrap:wrap;gap:10px}

  /* Bočný panel */
  .side{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}
  .box{background:var(--panel-2);border:1px solid var(--line);padding:22px}
  .box .btn{width:100%}
  .box .btn + .btn{margin-top:10px}
  .box-title{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px}
  .agent{display:flex;gap:14px;align-items:center}
  .agent-ph{width:64px;height:64px;flex:none;background:#26242a center/cover;display:grid;place-items:center;
    font-family:var(--serif);font-size:28px;color:var(--pin)}
  .agent b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1}
  .agent small{color:var(--pin);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .agent-rows{margin:14px 0 0;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
  .agent-rows dt{color:var(--muted)} .agent-rows dd{margin:0;text-align:right}
  .copied{color:var(--pin);font-size:13px;text-align:center;margin:8px 0 0;min-height:1em}

  /* Lokalita – výrez z mapy */
  .loc{padding:0 0 64px}
  .loc h2{font-size:34px;color:var(--pin);margin:0 0 16px}
  .loc-map{position:relative;height:clamp(300px,38vw,440px);border:1px solid var(--line);background:var(--sea);overflow:hidden}
  .loc-map:fullscreen{height:100vh;border:0}
  #loc-map{position:absolute;inset:0;background:transparent}
  .loc-tools{position:absolute;z-index:500;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
  .loc-tools button,.loc-tools a{width:40px;height:40px;display:grid;place-items:center;background:var(--panel);color:var(--pin);
    border:1px solid var(--pin);cursor:pointer;font:500 20px/1 var(--sans);text-decoration:none}
  .loc-tools button:hover,.loc-tools a:hover{background:var(--pin);color:var(--panel)}
  .loc-tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
  .loc-note{color:var(--muted);font-size:14px;margin:10px 0 0}
  .loc-note a{color:var(--pin)}
  .here{position:relative}
  .here::before{content:'';position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;
    background:rgba(201,169,97,.28);border:1px solid rgba(201,169,97,.7);animation:pulse 2.2s ease-out infinite}
  .here span{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-30px 0 0 -15px;background:var(--pin);
    border:3px solid var(--panel);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,.5)}
  @keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.3);opacity:0}}
  @media (prefers-reduced-motion:reduce){.here::before{animation:none;opacity:.6}}
  .leaflet-container{font-family:var(--sans)}

  /* Lightbox */
  .lb{position:fixed;inset:0;z-index:3000;background:rgba(6,6,8,.96);display:flex;align-items:center;justify-content:center}
  .lb[hidden]{display:none}
  .lb img{max-width:min(92vw,1500px);max-height:86vh;object-fit:contain}
  .lb button{position:absolute;border:0;background:rgba(201,169,97,.18);color:var(--pin);cursor:pointer;border-radius:50%;
    width:52px;height:52px;font-size:30px;line-height:1;display:grid;place-items:center}
  .lb button:hover{background:rgba(201,169,97,.4)}
  .lb .prev{left:20px;top:50%;transform:translateY(-50%)} .lb .next{right:20px;top:50%;transform:translateY(-50%)}
  .lb .close{top:20px;right:20px;font-size:22px}
  .lb .cnt{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--muted)}

  @media (max-width:960px){
    .body{grid-template-columns:1fr;gap:24px}
    .side{position:static;order:-1}
    .params{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .gallery{grid-template-columns:1fr;grid-template-rows:1fr;height:280px}
    .gallery button:not(:first-child){display:none}
    .gallery .m-only{display:block}
    .head-price{text-align:left}
  }
</style>
</head>
<body class="page">
<header id="site-header"></header>
<script src="nastavenia.js"></script>

<main class="wrap" id="main"><p class="empty">Načítavam…</p></main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Fotky">
  <button class="close" data-lb="close" aria-label="Zavrieť">✕</button>
  <button class="prev" data-lb="prev" aria-label="Predchádzajúca">‹</button>
  <img id="lb-img" alt="">
  <button class="next" data-lb="next" aria-label="Ďalšia">›</button>
  <div class="cnt" id="lb-cnt"></div>
</div>

<footer id="site-footer"></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="web.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');
  let photos = [], idx = 0;

  Promise.all([loadJSON('data.json', []), loadJSON('makleri.json', [])]).then(([houses, agents]) => {
    const h = (Array.isArray(houses) ? houses : []).find(x => x.id === id);
    if (!h) {
      $('#main').innerHTML = `<div style="padding:80px 0"><h1 style="font-size:48px;margin-bottom:12px">Ponuka sa nenašla</h1>
        <p class="lead">Možno už bola stiahnutá. <a class="link-more" href="ponuka.html">Späť na ponuku →</a></p></div>`;
      return;
    }
    document.title = h.name + ' – ' + AGENCY.name;
    photos = h.photos || [];
    const sold = statusesOf(h).includes('predane');
    const agent = h.agent && (agents || []).find(a => a.id === h.agent);

    // Galéria: veľká fotka + 2 menšie, zvyšok v prezeračke
    const n = photos.length;
    const gallery = n
      ? `<div class="gallery ${n === 1 ? 'one' : n === 2 ? 'two' : ''}">${photos.slice(0, 3).map((p, i) =>
          `<button data-photo="${i}" style="background-image:url('${esc(p)}')" aria-label="Fotka ${i + 1}">
             ${i === Math.min(n, 3) - 1 && n > 1 ? `<span class="more">Všetky fotky (${n})</span>` : ''}${i === 0 && n > 1 ? `<span class="more m-only">Fotky (${n})</span>` : ''}</button>`).join('')}</div>`
      : `<div class="no-photo">Zatiaľ bez fotiek</div>`;

    // Hlavné údaje
    const facts = [
      ['Typ', h.offer && optLabel('offer', h.offer)],
      ['Druh', h.type && optLabel('type', h.type)],
      ['Lokalita', h.area && optLabel('area', h.area)],
      ['Izby', h.rooms],
      ['Bazén', typeof h.pool === 'boolean' ? (h.pool ? 'Áno' : 'Nie') : null],
      ['Výhľad', h.view && [].concat(h.view).map(v => optLabel('view', v)).join(', ')]
    ].filter(([, v]) => v !== undefined && v !== null && v !== '');

    // Všetky parametre (vrátane "details" z data.json)
    const params = [...facts];
    if (typeof h.price === 'number') params.push(['Cena', fmtPrice(h.price)]);
    Object.entries(h.details || {}).forEach(([k, v]) => {
      if ((k === 'Cena' && typeof h.price === 'number') || (k === 'Štvrť' && h.area)) return;
      params.push([k, v]);
    });
    if (h.street) params.splice(0, 0, ['Ulica', h.street]);

    const desc = String(h.desc || '').split(/\n+/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('');
    const hasTour360 = hasTour(h);

    const agentBox = agent ? `<div class="box">
        <p class="box-title">Váš maklér</p>
        <div class="agent">
          <div class="agent-ph"${agent.photo ? ` style="background-image:url('${esc(agent.photo)}')"` : ''}>
            ${agent.photo ? '' : esc(String(agent.name).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase())}</div>
          <div><b>${esc(agent.name)}</b>${agent.role ? `<small>${esc(agent.role)}</small>` : ''}</div>
        </div>
        <dl class="agent-rows">${[['Discord', agent.discord], ['Telefón', agent.phone]].filter(([, v]) => v)
          .map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      </div>` : '';

    $('#main').innerHTML = `
      <div class="${sold ? 'is-sold' : ''}">
        <nav class="crumbs" aria-label="Navigácia"><a href="ponuka.html">Ponuka</a> › ${esc(h.name)}</nav>
        <div class="head">
          <div>
            <h1>${esc(h.name)}</h1>
            ${h.street ? `<p class="street">${esc(h.street)}</p>` : ''}
            ${statusesOf(h).length ? `<div class="badges">${badgesHtml(h)}</div>` : ''}
          </div>
          <div class="head-price"><b>${fmtPrice(h.price)}</b>${h.offer ? `<span>${esc(optLabel('offer', h.offer))}</span>` : ''}</div>
        </div>
        ${gallery}
        <div class="body">
          <div>
            ${params.length ? `<details class="block fold" open><summary><h2>Parametre</h2></summary><dl class="params">${params.map(([k, v]) =>
              `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></details>` : ''}
            ${(hasTour360 || h.video) ? `<section class="block"><h2>Prehliadka</h2><div class="media-btns">
              ${hasTour360 ? `<a class="btn btn-line" href="mapa.html?prehliadka=1#${encodeURIComponent(h.id)}">⟳ 360° prehliadka</a>` : ''}
              ${h.video ? `<a class="btn btn-line" href="${esc(h.video)}" target="_blank" rel="noopener">▶ Videoprehliadka</a>` : ''}
            </div></section>` : ''}
            ${desc ? `<section class="block desc"><h2>Popis</h2>${desc}</section>` : ''}
          </div>
          <aside class="side">
            <div class="box">
              <a class="btn btn-gold" href="${esc(h.contact || DISCORD)}" target="_blank" rel="noopener">${esc(CONTACT_LABEL)}</a>
              <a class="btn btn-line" href="mapa.html#${encodeURIComponent(h.id)}">Zobraziť na mape</a>
              <button class="btn btn-line" id="share" type="button">Zdieľať ponuku</button>
              <p class="copied" id="copied" aria-live="polite"></p>
            </div>
            ${agentBox}
          </aside>
        </div>
      </div>
      ${typeof h.x === 'number' && typeof h.y === 'number' ? `<section class="loc">
        <h2>Lokalita</h2>
        <div class="loc-map" id="loc-wrap">
          <div id="loc-map" role="application" aria-label="Poloha nehnuteľnosti na mape"></div>
          <div class="loc-tools">
            <button type="button" id="loc-fs" aria-label="Celá obrazovka" title="Celá obrazovka">
              <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            <button type="button" id="loc-in" aria-label="Priblížiť">+</button>
            <button type="button" id="loc-out" aria-label="Oddialiť">−</button>
          </div>
        </div>
        <p class="loc-note">${esc([h.street, h.area && optLabel('area', h.area)].filter(Boolean).join(', '))}
          ${h.street || h.area ? ' · ' : ''}<a href="mapa.html#${encodeURIComponent(h.id)}">Otvoriť na veľkej mape →</a></p>
      </section>` : ''}
      <section class="section" id="similar" style="padding-top:0"></section>`;
    if (typeof h.x === 'number' && typeof h.y === 'number') initLocMap(h);

    // Podobné ponuky: rovnaká lokalita alebo druh; ak žiadne nie sú, ukážu sa iné z ponuky (max. 3)
    const others = houses.filter(x => x.id !== h.id && !statusesOf(x).includes('predane'));
    const similar = others.filter(x => (h.area && x.area === h.area) || (h.type && x.type === h.type));
    const list = (similar.length ? similar : others).slice(0, 3);
    if (list.length) $('#similar').innerHTML = `<div class="section-head"><h2>${similar.length ? 'Podobné nehnuteľnosti' : 'Ďalšie nehnuteľnosti'}</h2>
      <a class="link-more" href="ponuka.html">Celá ponuka →</a></div><div class="grid">${list.map(cardHtml).join('')}</div>`;

    $('#share').addEventListener('click', () => {
      const done = () => { $('#copied').textContent = 'Odkaz skopírovaný ✓'; };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, () => { $('#copied').textContent = location.href; });
      else $('#copied').textContent = location.href;
    });
  });

  // Výrez z mapy (rovnaký obrázok mapa.jpg ako na stránke Mapa)
  function initLocMap(h) {
    const probe = new Image();
    probe.onload = () => {
      const W = probe.naturalWidth, H = probe.naturalHeight, bounds = [[0, 0], [H, W]];
      const map = L.map('loc-map', {crs: L.CRS.Simple, minZoom: -5, maxZoom: 2, zoomSnap: 0.5, zoomControl: false,
        attributionControl: false, scrollWheelZoom: false, maxBounds: bounds, maxBoundsViscosity: 1});
      L.imageOverlay('mapa.jpg', bounds).addTo(map);
      const pos = [H - h.y, h.x];
      map.setView(pos, -0.5);
      L.marker(pos, {interactive: false, keyboard: false,
        icon: L.divIcon({className: 'here', html: '<span></span>', iconSize: [0, 0]})}).addTo(map);
      $('#loc-in').onclick = () => map.zoomIn();
      $('#loc-out').onclick = () => map.zoomOut();
      map.on('click', () => map.scrollWheelZoom.enable());        // po kliknutí do mapy funguje aj koliesko
      map.on('mouseout', () => map.scrollWheelZoom.disable());
      $('#loc-fs').onclick = () => {
        const w = $('#loc-wrap');
        if (document.fullscreenElement) document.exitFullscreen();
        else if (w.requestFullscreen) w.requestFullscreen();
        else location.href = 'mapa.html#' + encodeURIComponent(h.id);
      };
      document.addEventListener('fullscreenchange', () => setTimeout(() => { map.invalidateSize(); map.panTo(pos); }, 100));
    };
    probe.onerror = () => { $('#loc-wrap').closest('.loc').hidden = true; };
    probe.src = 'mapa.jpg';
  }

  // Prezerač fotiek
  function show(i) {
    idx = (i + photos.length) % photos.length;
    $('#lb-img').src = photos[idx];
    $('#lb-cnt').textContent = `${idx + 1} / ${photos.length}`;
    document.querySelectorAll('.lb .prev,.lb .next').forEach(b => b.hidden = photos.length < 2);
    $('#lb').hidden = false;
  }
  document.addEventListener('click', e => {
    const p = e.target.closest('[data-photo]');
    if (p) return show(Number(p.dataset.photo));
    const a = e.target.closest('[data-lb]');
    if (a) { a.dataset.lb === 'close' ? ($('#lb').hidden = true) : show(idx + (a.dataset.lb === 'next' ? 1 : -1)); }
    else if (e.target.id === 'lb') $('#lb').hidden = true;
  });
  document.addEventListener('keydown', e => {
    if ($('#lb').hidden) return;
    if (e.key === 'Escape') $('#lb').hidden = true;
    if (e.key === 'ArrowRight') show(idx + 1);
    if (e.key === 'ArrowLeft') show(idx - 1);
  });
</script>
</body>
</html>
