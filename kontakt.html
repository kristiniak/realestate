<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt – ONYX Real Estate</title>
<link rel="icon" href="img/onyx_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="web.css">
<style>
  .page-top{padding:48px 0 28px;border-bottom:1px solid var(--line)}
  .page-top h1{font-size:clamp(48px,6vw,76px);color:var(--pin);margin:0 0 10px}
  .contact{display:grid;grid-template-columns:360px 1fr;gap:36px;padding:36px 0 72px;align-items:start}
  .info{display:flex;flex-direction:column;gap:14px}
  .card-i{background:var(--panel-2);border:1px solid var(--line);padding:20px 22px}
  .card-i .lbl{color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px}
  .card-i .val{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15;color:var(--text)}
  .card-i .sub{color:var(--muted);margin-top:4px}
  .card-i a.val{text-decoration:none;color:var(--pin)}
  .card-i a.val:hover{text-decoration:underline}
  /* Telefón a e-mail s ikonkou */
  .reach{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .reach li[hidden]{display:none}
  .reach a{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-size:18px}
  .reach a:hover{color:var(--pin)}
  .reach svg{width:20px;height:20px;flex:none;fill:var(--pin)}
  .info .btn{width:100%}
  .info .grow{flex:1}

  .cmap{position:relative;height:420px;border:1px solid var(--pin);background:#0a0a0c;overflow:hidden}
  .cmap:fullscreen{border:0}
  #cmap{position:absolute;inset:0;background:#0a0a0c}
  .leaflet-container{font-family:var(--sans)}
  .cm-tools{position:absolute;z-index:500;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
  .cm-tools button{width:42px;height:42px;display:grid;place-items:center;background:var(--panel);color:var(--pin);
    border:1px solid var(--pin);cursor:pointer;font:500 22px/1 var(--sans)}
  .cm-tools button:hover{background:var(--pin);color:var(--panel)}
  .cm-tools button:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
  .cm-tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
  .cm-hint{position:absolute;z-index:500;left:12px;bottom:12px;background:rgba(13,13,15,.85);border:1px solid var(--line);
    color:var(--muted);font-size:13px;padding:6px 10px;pointer-events:none}

  /* Naša kancelária */
  .us{position:relative}
  .us::before{content:'';position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
    background:rgba(243,236,220,.18);border:2px solid #f3ecdc;animation:pulse 2.2s ease-out infinite}
  .us .dot{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-34px 0 0 -17px;background:#f3ecdc;
    border:3px solid #0a0a0c;outline:2px solid var(--pin);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 12px rgba(0,0,0,.6)}
  .us .dot img{width:18px;height:18px;transform:rotate(45deg);margin:5px;display:block;filter:brightness(0)}
  .us .tag{position:absolute;left:50%;top:50%;transform:translate(-50%,10px);white-space:nowrap;background:var(--panel);
    color:var(--pin);border:1px solid var(--pin);padding:4px 10px;font:600 15px var(--serif);letter-spacing:.06em}
  @keyframes pulse{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.25);opacity:0}}
  @media (prefers-reduced-motion:reduce){.us::before{animation:none;opacity:.5}}
  /* Názvy ulíc – text ide po strede cesty aj v zákrutách (SVG vrstva, zväčšuje sa spolu s mapou) */
  .streets text{fill:#0a0a0c;font-family:var(--sans);font-weight:600;letter-spacing:.02em;paint-order:stroke;
    stroke:var(--pin);stroke-width:1.6px;stroke-linejoin:round;dominant-baseline:central}
  .far .streets{display:none}
  /* Orientačné body */
  .lm{position:relative}
  .lm i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#f3ecdc;border:2px solid #0a0a0c}
  .lm span{position:absolute;left:10px;top:-11px;white-space:nowrap;color:#f3ecdc;font:500 13px var(--sans);
    text-shadow:0 0 3px #000,0 0 6px #000}

  @media (max-width:900px){
    .contact{grid-template-columns:1fr}
    .cmap{height:340px;order:-1}
  }
</style>
</head>
<body class="page">
<header id="site-header"></header>
<script src="nastavenia.js"></script>

<main class="wrap">
  <div class="page-top">
    <h1>Kontakt</h1>
    <p class="lead">Navštívte nás v kancelárii alebo nám zavolajte. Radi vám pomôžeme nájsť nový domov.</p>
  </div>

  <div class="contact">
    <div class="info">
      <div class="card-i"><p class="lbl">Adresa</p><div class="val" id="c-addr"></div><div class="sub" id="c-district"></div></div>
      <div class="card-i" id="c-reach-box"><p class="lbl">Kontakt</p>
        <ul class="reach">
          <li id="c-phone-li"><a id="c-phone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg><span></span></a></li>
          <li id="c-email-li"><a id="c-email"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4.4 7H19.6L12 12.2zM4 8.6V17h16V8.6l-7.4 5.1a1 1 0 0 1-1.2 0L4 8.6z"/></svg><span></span></a></li>
        </ul></div>
      <div class="card-i" id="c-hours-box" hidden><p class="lbl">Otváracie hodiny</p><div class="val" id="c-hours" style="font-size:22px"></div></div>
      <div class="grow"></div>
      <a class="btn btn-gold" href="ponuka.html">Prezrieť ponuku</a>
      <a class="btn btn-line" href="makleri.html">Naši makléri</a>
    </div>

    <div class="cmap" id="cmap-wrap">
      <div id="cmap" role="application" aria-label="Mapa – poloha kancelárie"></div>
      <div class="cm-tools">
        <button type="button" id="cm-fs" aria-label="Celá obrazovka" title="Celá obrazovka">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button type="button" id="cm-in" aria-label="Priblížiť">+</button>
        <button type="button" id="cm-out" aria-label="Oddialiť">−</button>
        <button type="button" id="cm-home" aria-label="Späť na kanceláriu" title="Späť na kanceláriu">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      </div>
      <div class="cm-hint" id="cm-hint">Oddiaľte mapu kolieskom alebo tlačidlom −</div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="web.js"></script>
<script src="kontakt-ulice.js"></script>
<script>
  // Údaje sa berú zo súboru nastavenia.js (CONTACT)
  $('#c-addr').textContent = CONTACT.address || '';
  $('#c-district').textContent = CONTACT.district || '';
  if (CONTACT.phone) { $('#c-phone span').textContent = CONTACT.phone; $('#c-phone').href = 'tel:' + String(CONTACT.phone).replace(/[^\d+]/g, ''); }
  else $('#c-phone-li').hidden = true;
  if (CONTACT.email) { $('#c-email span').textContent = CONTACT.email; $('#c-email').href = 'mailto:' + CONTACT.email; }
  else $('#c-email-li').hidden = true;
  if (!CONTACT.phone && !CONTACT.email) $('#c-reach-box').hidden = true;
  if (CONTACT.hours) { $('#c-hours').textContent = CONTACT.hours; $('#c-hours-box').hidden = false; }

  const probe = new Image();
  probe.onload = () => {
    const W = probe.naturalWidth, H = probe.naturalHeight, bounds = [[0, 0], [H, W]];
    const ll = p => [H - p.y, p.x];                                    // y počítame zhora ako v obrázku
    const map = L.map('cmap', {crs: L.CRS.Simple, zoomControl: false, attributionControl: false, zoomSnap: 0.25,
      maxBounds: bounds, maxBoundsViscosity: 1, scrollWheelZoom: true, minZoom: -6, maxZoom: 1});
    L.imageOverlay(CONTACT.map, bounds).addTo(map);
    const fitZoom = () => map.getBoundsZoom(bounds, false);             // najmenšie zobrazenie = celá mapa v okne
    const home = () => map.setView(ll(CONTACT.pin), 0);
    window.contactMap = map;
    map.setMinZoom(fitZoom()); home();
    map.on('resize', () => map.setMinZoom(fitZoom()));

    // Názvy ulíc (súbor kontakt-ulice.js) – SVG vrstva v súradniciach obrázka
    if (typeof CONTACT_STREETS !== 'undefined') {
      const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'streets');
      const defs = document.createElementNS(NS, 'defs'); svg.appendChild(defs);
      CONTACT_STREETS.forEach((s, i) => {
        const p = document.createElementNS(NS, 'path'); p.setAttribute('id', 'ul' + i); p.setAttribute('d', s.path); defs.appendChild(p);
        const t = document.createElementNS(NS, 'text'); t.setAttribute('font-size', s.fs || 10);
        const tp = document.createElementNS(NS, 'textPath'); tp.setAttribute('href', '#ul' + i); tp.setAttribute('startOffset', '50%');
        tp.setAttribute('text-anchor', 'middle'); tp.textContent = s.name; t.appendChild(tp); svg.appendChild(t);
      });
      L.svgOverlay(svg, bounds, {interactive: false}).addTo(map);
    }
    const far = () => $('#cmap').classList.toggle('far', map.getZoom() < -1.5);   // pri veľkom oddialení sa názvy skryjú
    map.on('zoomend', far); far();
    (CONTACT.landmarks || []).forEach(p => L.marker(ll(p), {interactive: false, keyboard: false,
      icon: L.divIcon({className: 'lm', html: `<i></i><span>${esc(p.name)}</span>`, iconSize: [0, 0]})}).addTo(map));
    L.marker(ll(CONTACT.pin), {interactive: false, keyboard: false, zIndexOffset: 1000,
      icon: L.divIcon({className: 'us', iconSize: [0, 0],
        html: `<div class="dot">${AGENCY.logo ? `<img src="${esc(AGENCY.logo)}" alt="" onerror="this.remove()">` : ''}</div><div class="tag">${esc(AGENCY.name)}</div>`})}).addTo(map);

    $('#cm-in').onclick = () => map.zoomIn(0.5);
    $('#cm-out').onclick = () => map.zoomOut(0.5);
    $('#cm-home').onclick = home;
    $('#cm-fs').onclick = () => {
      const w = $('#cmap-wrap');
      if (document.fullscreenElement) document.exitFullscreen(); else if (w.requestFullscreen) w.requestFullscreen();
    };
    document.addEventListener('fullscreenchange', () => setTimeout(() => map.invalidateSize(), 100));
    map.once('zoomstart movestart', () => { $('#cm-hint').hidden = true; });
  };
  probe.onerror = () => { $('#cmap-wrap').innerHTML = '<p class="empty" style="padding:24px">Mapa sa nenačítala.</p>'; };
  probe.src = CONTACT.map;
</script>
</body>
</html>
